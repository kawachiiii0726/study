<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/head :: head_fragment(title = 'タスク編集', scripts = ~{::script}, links = ~{::link})"></head>
<body>
<div class="container">

  <div th:if="${validationError}" th:each="err : ${validationError}">
    <label class="text-danger" th:text="${err}"></label>
  </div>

  <h1>タスク編集</h1>

  <form th:action="@{/task/update}" th:object="${taskUpdateRequest}" method="post">

    <input type="hidden" th:field="*{taskId}" />

    <div class="form-group">
      <label>タスク名</label>
      <input type="text" class="form-control" th:field="*{taskName}">
    </div>

    <div class="form-group">
      <label>タスク状況</label>
      <input type="text" class="form-control" th:field="*{taskStatus}">
    </div>

    <div class="form-group">
      <label>開始日</label>
      <input type="date" class="form-control" th:field="*{startDate}">
    </div>

    <div class="form-group">
      <label>終了日</label>
      <input type="date" class="form-control" th:field="*{endDate}">
    </div>

    <div class="text-center mt-3">
      <input type="submit" class="btn btn-primary" value="保存" />
      <a th:href="@{/task/{id}(id=*{taskId})}" class="btn btn-secondary">キャンセル</a>
    </div>
  </form>

</div>
</body>
</html>
