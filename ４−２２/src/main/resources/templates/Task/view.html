<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/head :: head_fragment(title = 'タスク詳細', scripts = ~{::script}, links = ~{::link})"></head>
<body>
<div class="container">
  <h1>タスク詳細</h1>

  <table class="table table-bordered">
    <tr>
      <th style="width: 160px;">ID</th>
      <td th:text="${task.taskId}">1</td>
    </tr>
    <tr>
      <th>タスク名</th>
      <td th:text="${task.taskName}">サンプル</td>
    </tr>
    <tr>
      <th>タスク状況</th>
      <td th:text="${task.taskStatus}">未対応</td>
    </tr>
    <tr>
      <th>開始日</th>
    
      <td th:text="${task.startDate != null ? #dates.format(task.startDate, 'yyyy/MM/dd') : ''}"></td>
    </tr>
    <tr>
      <th>終了日</th>
      <td th:text="${task.endDate != null ? #dates.format(task.endDate, 'yyyy/MM/dd') : ''}"></td>
    </tr>
  </table>

  <div class="mt-3">
    <a th:href="@{/task/list}" class="btn btn-secondary">一覧へ戻る</a>

    <a th:href="@{/task/{id}/edit(id=${task.taskId})}" class="btn btn-primary">編集</a>
	<form th:action="@{/task/{id}/delete(id=${task.taskId})}" method="post"
	      onsubmit="return confirm('削除しますか？');">
	  <button type="submit" class="btn btn-danger">削除</button>
	</form>

  </div>
</div>
</body>
</html>
